<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #0f1115; color: #e5e7eb;
               font-family: sans-serif; overflow: hidden; touch-action: none; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #unzoom { position: absolute; right: 10px; bottom: 10px; display: none; padding: 8px 12px;
            border: 0; border-radius: 16px; background: #2a1f4a; color: #e5e7eb; font-size: 14px; }
  #err { position: absolute; top: 8px; left: 8px; right: 8px; color: #ef4444; font-size: 14px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<button id="unzoom" onclick="muninn.resetZoom()">⤢ fit</button>
<script>
// Muninn game host (Android). Mirrors python/src/muninn/gui/qml/GameView.qml:
// state = setup(players, seed, opts) folded over moves (ignoring out-of-turn /
// illegal ones) so every device computes the same game.
(function () {
  var canvas = document.getElementById("c");
  var err = document.getElementById("err");
  var game = null, info = {}, state = null, ui = {}, W = 0, H = 0, OX = 0, OY = 0, last = 0;
  // Host-level zoom/pan (pinch, drag, double-tap) so big boards work on a phone.
  var Z = 1, PX = 0, PY = 0;

  function turnOf(s) { try { return game.turn ? game.turn(s) : null; } catch (e) { return null; } }
  function myTurn() {
    if (!info.started || info.ended || !state) return false;
    var t = turnOf(state);
    return t === null || t === undefined || t === info.me;
  }
  function view() {
    return { w: W, h: H, me: info.me, players: info.players || [], names: info.names || {}, ui: ui, myTurn: myTurn() };
  }
  var forcedW = 0, forcedH = 0;  // set by the host app (WebView viewport can lie)
  function layout() {
    var aspect = (game && game.aspect) || 1;
    var r = canvas.getBoundingClientRect();
    var w = forcedW || r.width, h = forcedH || r.height;
    if (forcedW) { canvas.style.width = w + "px"; canvas.style.height = h + "px"; }
    W = Math.min(w, h * aspect); H = W / aspect;
    OX = (w - W) / 2; OY = (h - H) / 2;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    paint();
  }
  function paint() {
    var ctx = canvas.getContext("2d");
    var dpr = window.devicePixelRatio || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.translate(OX + PX, OY + PY);
    ctx.scale(Z, Z);
    ctx.fillStyle = "#151820"; ctx.fillRect(0, 0, W, H);
    if (!game || !state) return;
    try { game.render(ctx, state, view()); } catch (e) { err.textContent = "render error: " + e; }
  }
  function status() {
    var st = { over: false, text: "" };
    try { if (game && game.status && state) st = game.status(state, info.names || {}); } catch (e) {}
    return st;
  }
  function report() {
    var st = status();
    Android.status(JSON.stringify({ over: !!st.over, text: st.text || "", myTurn: myTurn(), spectator: !!info.spectator,
                                    realtime: !!(game && game.tick) }));
  }
  function replay() {
    if (!game || !info.session) return;
    try {
      var s = game.setup(info.players, info.seed, info.opts || {});
      var moves = info.moves || [];
      for (var i = 0; i < moves.length; i++) {
        var t = turnOf(s);
        if (t !== null && t !== undefined && t !== moves[i].sender) continue;
        try { s = game.move(s, moves[i].sender, moves[i].m); } catch (e) {}
      }
      state = s;
    } catch (e) { err.textContent = "game error: " + e; }
  }
  // The player whose move ends the game records the result (scoreboard).
  function reportResult(after) {
    try {
      var st = game.status ? game.status(after, info.names || {}) : null;
      if (st && st.over && !info.result)
        Android.result(JSON.stringify({ winners: st.winners || [], text: st.text || "" }));
    } catch (e) {}
  }
  function input(ev) {
    if (!game || !game.input || !state) return;
    var r = null;
    try { r = game.input(state, view(), ev); } catch (e) { return; }
    if (!r) return;
    if (r.ui) { for (var k in r.ui) ui[k] = r.ui[k]; paint(); }
    if (r.move !== undefined && r.move !== null) {
      if (!myTurn()) { Android.toast("not your turn"); return; }
      var after;
      try { after = game.move(state, info.me, r.move); } catch (e) { Android.toast("illegal move: " + e); return; }
      ui = {};
      Android.move(JSON.stringify(r.move));
      reportResult(after);
    }
    if (r.rt !== undefined) Android.rt(JSON.stringify(r.rt));
  }

  window.muninn = {
    load: function () {
      try { game = (new Function(Android.code() + "\n;return game;"))(); }
      catch (e) { err.textContent = "Could not load game: " + e; }
      layout();
    },
    update: function (json) {
      info = JSON.parse(json);
      replay(); paint(); report();
    },
    rt: function (sender, json) {
      if (!game || !game.onRt) return;
      try { state = game.onRt(state, sender, JSON.parse(json)); paint(); } catch (e) {}
    },
    key: function (k, down) { input({ type: "key", key: k, down: down }); },
    size: function (w, h) { forcedW = w; forcedH = h; layout(); },
    resetZoom: function () { Z = 1; clampPan(); paint(); }
  };

  // --- gestures: tap = click, one-finger drag = pan (when zoomed), pinch = zoom.
  // (No double-tap zoom: the first tap would already have played a move.)
  function clampPan() {
    PX = Math.min(0, Math.max(W - W * Z, PX));
    PY = Math.min(0, Math.max(H - H * Z, PY));
    if (Z <= 1) { Z = 1; PX = 0; PY = 0; }
    document.getElementById("unzoom").style.display = Z > 1 ? "block" : "none";
  }
  function zoomAt(f, x, y) {   // x, y relative to the board's top-left
    var nz = Math.max(1, Math.min(8, Z * f));
    PX = x - (x - PX) * nz / Z; PY = y - (y - PY) * nz / Z; Z = nz;
    clampPan(); paint();
  }
  var pts = {}, gesture = null;
  function local(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left - OX, y: e.clientY - r.top - OY };
  }
  function pinchInfo() {
    var k = Object.keys(pts); if (k.length < 2) return null;
    var a = pts[k[0]], b = pts[k[1]];
    return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }
  canvas.addEventListener("pointerdown", function (e) {
    pts[e.pointerId] = local(e);
    var n = Object.keys(pts).length;
    if (n === 1) gesture = { kind: "tap", start: local(e), px: PX, py: PY };
    else if (n === 2) { var p = pinchInfo(); gesture = { kind: "pinch", d: p.d, z: Z, x: p.x, y: p.y }; }
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!(e.pointerId in pts) || !gesture) return;
    pts[e.pointerId] = local(e);
    if (gesture.kind === "pinch") {
      var p = pinchInfo(); if (!p || !gesture.d) return;
      var target = gesture.z * p.d / gesture.d;
      zoomAt(target / Z, p.x, p.y);
      PX += p.x - gesture.x; PY += p.y - gesture.y; gesture.x = p.x; gesture.y = p.y;
      clampPan(); paint();
    } else {
      var q = local(e), dx = q.x - gesture.start.x, dy = q.y - gesture.start.y;
      if (gesture.kind === "tap" && Math.hypot(dx, dy) > 10 && Z > 1) gesture.kind = "pan";
      if (gesture.kind === "pan") { PX = gesture.px + dx; PY = gesture.py + dy; clampPan(); paint(); }
    }
  });
  function up(e) {
    var was = gesture;
    delete pts[e.pointerId];
    if (Object.keys(pts).length) { if (was && was.kind === "pinch") gesture = { kind: "done" }; return; }
    gesture = null;
    if (!was || was.kind !== "tap" || e.type === "pointercancel") return;
    var q = local(e);
    var x = (q.x - PX) / Z, y = (q.y - PY) / Z;
    if (x < 0 || y < 0 || x > W || y > H) return;
    input({ type: "click", x: x, y: y });
  }
  canvas.addEventListener("pointerup", up);
  canvas.addEventListener("pointercancel", up);
  window.addEventListener("resize", layout);
  // WebView may report a 0-height viewport at load; catch the real size.
  var lastRect = "";
  function checkSize() {
    var r = canvas.getBoundingClientRect();
    var k = r.width + "x" + r.height;
    if (k !== lastRect) { lastRect = k; layout(); }
  }
  if (window.ResizeObserver) new ResizeObserver(checkSize).observe(canvas);
  setInterval(checkSize, 400);

  var lastW = 0, lastH = 0;
  function frame(ts) {
    if (window.innerWidth !== lastW || window.innerHeight !== lastH) {
      lastW = window.innerWidth; lastH = window.innerHeight; layout();
    }
    if (game && game.tick && info.started && !info.ended && state) {
      var dt = last ? (ts - last) / 1000 : 0.033;
      try {
        var r = game.tick(state, dt, view());
        if (r) { state = r.state; if (r.rt !== undefined) Android.rt(JSON.stringify(r.rt)); }
      } catch (e) {}
      paint();
    }
    last = ts;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.muninn.load();
})();
</script>
</body>
</html>
