# Standalone desktop builds (no Python or Nix needed on the user's machine).
# Runs when a release is published (tools/release.sh creates it with the
# Android APK) and attaches the binaries to it; can also be run by hand.
name: desktop builds

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 → glibc 2.35: runs on most Linux distros from 2022 on
          - os: ubuntu-22.04
            suffix: linux-x86_64
            exe: ""
          - os: windows-latest
            suffix: windows-x86_64
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libglib2.0-dev libgirepository1.0-dev \
            libcairo2-dev pkg-config libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: install
        run: |
          python -m pip install --upgrade pip
          # PyGObject >= 3.51 needs girepository-2.0 (not on 22.04)
          if [ "$RUNNER_OS" = Linux ]; then pip install "PyGObject<3.51"; fi
          pip install "./python[gui]" pyinstaller
      - name: build
        run: |
          # C extensions PyInstaller can't see through imports: PyNaCl's cffi
          # backend, dbus-python's bindings (BlueZ), the WinRT projections.
          common="--collect-all muninn --collect-submodules muninn --collect-all nacl --hidden-import _cffi_backend"
          if [ "$RUNNER_OS" = Linux ]; then
            common="$common --hidden-import _dbus_bindings --hidden-import _dbus_glib_bindings --hidden-import dbus.mainloop.glib --collect-submodules gi"
          else
            common="$common --collect-submodules winrt"
          fi
          common="$common --paths packaging --hidden-import selftest"
          pyinstaller --noconfirm --onefile --name "muninn-gui-${{ matrix.suffix }}" \
            --windowed $common packaging/muninn_gui.py
          pyinstaller --noconfirm --onefile --name "muninn-${{ matrix.suffix }}" \
            $common --exclude-module PySide6 packaging/muninn_cli.py
          ls -la dist
      - name: smoke test (imports everything, no Bluetooth needed)
        run: |
          MUNINN_SELFTEST=1 ./dist/muninn-${{ matrix.suffix }}${{ matrix.exe }}
          MUNINN_SELFTEST=1 QT_QPA_PLATFORM=offscreen ./dist/muninn-gui-${{ matrix.suffix }}${{ matrix.exe }}
      - name: checksums (the self-updater verifies them)
        run: |
          cd dist
          for f in muninn-*; do
            case "$f" in *.sha256) ;; *) python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest(), sys.argv[1])" "$f" > "$f.sha256";; esac
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: muninn-${{ matrix.suffix }}
          path: dist/*
      - name: attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
