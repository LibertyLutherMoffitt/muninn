repos:
  - repo: local
    hooks:
      - id: alejandra
        name: alejandra
        entry: alejandra
        language: system
        files: '\.nix$'

      - id: nix-flake-check
        name: nix flake check
        entry: nix flake check
        language: system
        pass_filenames: false
        files: '\.nix$|flake\.lock$'

      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]

      - id: ty-check
        name: ty check
        entry: ty check --project python/
        language: system
        pass_filenames: false
        files: '\.py$'

      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        files: '^tea/.*\.go$'

      - id: go-vet-test
        name: go vet + test (tea/)
        entry: bash -c 'cd tea && go vet ./... && go test ./...'
        language: system
        pass_filenames: false
        files: '^tea/'
